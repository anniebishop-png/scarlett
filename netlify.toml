[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Weekday morning digest. Runs on the hour and half hour; it only sends to devices where it is 9:30am local time.
[functions."push-digest"]
  schedule = "0,30 * * * *"

# Weekday morning to-dos in Slack. Runs on the hour and half hour; the function only sends in the 9:00 hour (London by default).
[functions."slack-digest"]
  schedule = "0,30 * * * *"
